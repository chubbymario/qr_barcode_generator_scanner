# Checks pull requests (and Dependabot updates) before they reach main.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Opens the built site in the runner's preinstalled Chrome, makes codes
      # in each tab and checks they scan back.
      - name: Browser smoke test
        run: npm run test:e2e
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
